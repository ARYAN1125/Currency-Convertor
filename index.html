<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Currency Converter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Animated Background -->
  <div class="background-3d">
    <div class="currency-symbols">
      <span>$</span><span>€</span><span>₹</span><span>£</span><span>¥</span><span>₩</span><span>₽</span><span>A$</span>
    </div>
  </div>

  <!-- Container -->
  <div class="converter-container">
    <h1>Currency Converter</h1>

    <div class="currency-box">
      <select id="from-currency">
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="INR">INR</option>
        <option value="GBP">GBP</option>
        <option value="JPY">JPY</option>
      </select>

      <input type="number" id="amount" placeholder="Amount" />
    </div>

    <div class="currency-box">
      <select id="to-currency">
        <option value="INR">INR</option>
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="GBP">GBP</option>
        <option value="JPY">JPY</option>
      </select>

      <input type="text" id="converted-amount" readonly />
    </div>

    <button onclick="convertCurrency()">Convert</button>

    <button class="toggle-btn" onclick="toggleMode()">🌙 / ☀️</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
